# 모든 훅을 로컬에서 실행한다 (uv 환경의 ruff, 저장소 자체 검사 스크립트).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: text-rules
        name: 문구·파일 규칙 (em dash, PDF, data/raw 금지)
        entry: uv run python -m pipeline.quality.check_text_rules
        language: system
        pass_filenames: true
